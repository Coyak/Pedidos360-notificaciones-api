# Configuración del Puerto del Servidor
server.port=8082
spring.application.name=notificaciones-api

# Conexión a RabbitMQ Broker (Clúster Pedidos360)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360_pass}

# Topología Centralizada de Mensajería Pedidos360
pedidos360.rabbitmq.exchange.pedidos=pedidos.exchange
pedidos360.rabbitmq.exchange.dlx=pedidos.dlx.exchange
pedidos360.rabbitmq.queue.notificaciones=pedidos.notificaciones.queue
pedidos360.rabbitmq.queue.notificaciones-dlq=pedidos.notificaciones.dlq
pedidos360.rabbitmq.routing-key.creado=pedidos.pedido.creado
pedidos360.rabbitmq.routing-key.notificaciones-dlq=pedidos.notificaciones.dlq

# Configuración de Emisor SMTP / Simulación
pedidos360.notificaciones.remitente=noreply@pedidos360.cloud

# Configuración de Gmail SMTP (Guía docente)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ovjzqmswyvywxevm}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
